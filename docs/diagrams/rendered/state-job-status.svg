<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="539px" preserveAspectRatio="none" style="width:1251px;height:539px;background:#FFFFFF;" version="1.1" viewBox="0 0 1251 539" width="1251px" zoomAndPan="magnify"><title>State Machine - Job.status lifecycle</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="246.2578" x="301.6211" y="23.5625">State Machine - Job.status lifecycle</text><ellipse cx="481" cy="59.9395" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="456" y="145.4395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.8604" x="461.0698" y="170.5322">active</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="58.8359" x="257.5" y="272.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="48.8359" x="262.5" y="298.0322">paused</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="53.9072" x="417" y="392.4395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="43.9072" x="422" y="417.5322">closed</text><ellipse cx="444" cy="522.9395" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="444" cy="522.9395" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN16"><path d="M489.5,367.9395 L489.5,408.4395 L471.3672,412.4395 L489.5,416.4395 L489.5,456.5869 A0,0 0 0 0 489.5,456.5869 L850.5947,456.5869 A0,0 0 0 0 850.5947,456.5869 L850.5947,377.9395 L840.5947,367.9395 L489.5,367.9395 A0,0 0 0 0 489.5,367.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M840.5947,367.9395 L840.5947,377.9395 L850.5947,377.9395 L840.5947,367.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.8838" x="495.5" y="385.5332">TogglePauseJob explicitly rejects closed jobs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.3042" x="495.5" y="401.2627">(400 "This job was closed by the admin.").</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.0947" x="495.5" y="416.9922">UpdateJob has no such check, so a company can send</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.4038" x="495.5" y="432.7217">status "active" for a closed job. Observed in code;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.8887" x="495.5" y="448.4512">see implementation-gaps.md.</text></g><g id="elem_GMN19"><path d="M6,128.9395 L6,201.8574 A0,0 0 0 0 6,201.8574 L437.6934,201.8574 A0,0 0 0 0 437.6934,201.8574 L437.6934,169.4395 L455.8058,165.4395 L437.6934,161.4395 L437.6934,138.9395 L427.6934,128.9395 L6,128.9395 A0,0 0 0 0 6,128.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M427.6934,128.9395 L427.6934,138.9395 L437.6934,138.9395 L427.6934,128.9395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="375.0068" x="12" y="146.5332">Only "active" jobs are returned by GET /jobs and /jobs/latest,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.7139" x="12" y="162.2627">and only "active" jobs accept applications.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="396.9951" x="12" y="177.9922">Passing the deadline does NOT change status; ApplyJob checks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="410.6934" x="12" y="193.7217">the date, and the admin list derives a "Closed" label from daysLeft.</text></g><polygon fill="#181818" points="481,145.1727,485,136.1727,481,140.1727,477,136.1727,481,145.1727" style="stroke:#181818;stroke-width:1.0;"/><path d="M481,74.1895 C481,91.3256 481,118.1859 481,139.1727 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.7544" x="483" y="106.5332">CreateJob (POST /company/jobs/create)</text><polygon fill="#181818" points="272.6393,272.8936,271.1779,263.1538,269.9532,268.6765,264.4305,267.4517,272.6393,272.8936" style="stroke:#181818;stroke-width:1.0;"/><path d="M467.0587,185.7595 C461.5394,191.9701 454.673,198.2041 447,201.9395 C410.6571,219.6319 293.1307,189.9769 266,219.9395 C252.8031,234.5139 259.2572,251.8844 269.4159,267.833 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.2773" x="284.5642" y="234.5332">company TogglePauseJob</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.4058" x="268" y="250.2627">or UpdateJob {status:"paused"}</text><polygon fill="#181818" points="467.4934,185.6104,458.5563,189.7491,464.2007,189.3731,464.5766,195.0175,467.4934,185.6104" style="stroke:#181818;stroke-width:1.0;"/><path d="M257.2567,291.724 C184.0421,290.2717 5.1198,280.5964 63,219.9395 C92.4874,189.0374 408.12,219.6254 447,201.9395 C454.9234,198.3352 457.9791,196.4826 463.5421,190.1256 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.2773" x="77.397" y="234.5332">company TogglePauseJob</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.0713" x="65" y="250.2627">or UpdateJob {status:"active"}</text><polygon fill="#181818" points="455.8484,392.0092,464.3524,387.0409,458.7692,387.9509,457.8592,382.3677,455.8484,392.0092" style="stroke:#181818;stroke-width:1.0;"/><path d="M506.0772,171.0629 C578.5281,185.4831 779.0674,233.4841 716,312.9395 C649.0427,397.2954 571.5787,311.26 480,367.9395 C470.3308,373.9239 465.5376,378.5466 459.3533,387.1393 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.1885" x="730" y="298.0332">admin CloseJob</text><polygon fill="#181818" points="426.4187,392.1354,422.9144,382.931,422.8952,388.5878,417.2384,388.5686,426.4187,392.1354" style="stroke:#181818;stroke-width:1.0;"/><path d="M308.3663,313.0615 C321.96,324.6375 340.2831,339.1903 358,349.9395 C374.6671,360.0517 381.8027,357.0906 398,367.9395 C408.2281,374.7902 414.0831,379.7156 422.1905,387.8783 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.1885" x="360" y="345.5332">admin CloseJob</text><polygon fill="#181818" points="479.9305,185.6098,475.3766,194.3426,479.6185,190.6001,483.361,194.8419,479.9305,185.6098" style="stroke:#181818;stroke-width:1.0;"/><path d="M450.1668,392.2389 C453.8171,380.2032 458.251,364.301 461,349.9395 C472.3566,290.6093 477.458,225.1505 479.556,191.5981 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.2383" x="475" y="290.0332">company UpdateJob {status:"active"}</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.2222" x="500.5081" y="305.7627">(permitted by code, see note)</text><polygon fill="#181818" points="455.0919,523.0167,464.0808,527.0414,460.0919,523.0305,464.1028,519.0415,455.0919,523.0167" style="stroke:#181818;stroke-width:1.0;"/><path d="M506.2702,165.657 C571.7569,165.1228 747.9079,173.4692 835,272.9395 C889.3655,335.0318 913.5902,394.1767 860,456.9395 C805.6309,520.6144 521.6541,523.1997 461.0919,523.0332 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="357.6016" x="885" y="345.5332">company DeleteJob / admin DeleteJob / company deleted</text><polygon fill="#181818" points="432.9262,520.9521,424.9058,515.236,428.0268,519.954,423.3089,523.075,432.9262,520.9521" style="stroke:#181818;stroke-width:1.0;"/><path d="M284.6457,313.124 C281.6791,345.9224 280.3046,413.4381 312,456.9395 C342.4777,498.7696 401.1643,514.4817 427.047,519.7544 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.79" x="314" y="417.5332">same deletions</text><polygon fill="#181818" points="444,511.7675,448,502.7675,444,506.7675,440,502.7675,444,511.7675" style="stroke:#181818;stroke-width:1.0;"/><path d="M444,432.5129 C444,455.4295 444,487.1166 444,505.7675 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.79" x="446" y="489.5332">same deletions</text><!--SRC=[bPHDRnCn48Rl-ok6d5AKR7hWr4f8g20a12HImudsCB5dTztwIxRJiaByTyRhJR9K0OcZn_E-C_FuuvKFs1e4ZRtR9uY64bgiaagQu3PX8lY2ebEMO0cVtAwE7Dj7qAeXqGjDLNnKrcD00x53wPwLRQ517Qdgb2GWurCFag88oYVbR5LzVtqFo-LRG97K4y4Lt0JYGkmEyytwTWihuOn7swyUt2wknB1xKLLZVfPwt4UIB1qpOUlQLjCcXzddphe0txmSNN-MfgzcHJRxLOtwFxhuFwiYOwj9LqAxqXLAeopSv2MBfjN-bZB6ppRqZ-ftTkuf69KIYtSzIoGj81A1TI-PPUmdq_UagPYknbwcaKEM769oEa6nYMYexFAHncdxP_Uht0u4rNO9N3DIgE05Qw0VNYl1Tw-7G0yaKZm0opU1y-TlBYzXjkrKp15uncC23vywAgFKiukQaq_SEiwp3k9UT20w4e_Co04UnnHe6PhD7Ott-q0O6Zv-d7HHmteNAJpnYfbbtjTPnSILyPeCMJRWcPSj-bWRMLViEvp6245JCp0e1LYxjZpkiLuU530mB4hxOCja7p_meoWxR5QU
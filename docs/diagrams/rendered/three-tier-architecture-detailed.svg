<text x="540" y="551" text-anchor="middle" font-size="12" font-weight="700" fill="#111">httpOnly accessToken cookie, CORS with credentials</text>
<g transform="translate(0,-25)">
<rect x="40" y="605" width="1000" height="470" fill="#b9c6d2" stroke="#6b7f92" stroke-width="1.6"/>
<text x="540.0" y="627" text-anchor="middle" font-size="14" font-weight="700" fill="#111">APPLICATION TIER - Business Logic Layer</text>
<rect x="240" y="640" width="600" height="92" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="540.0" y="662" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111">EXPRESS 5 REST API PIPELINE  (Node.js, base path /api/v1, port 5000)</text>
<text x="540.0" y="687" text-anchor="middle" font-size="12" fill="#111">CORS (CLIENT_URL), JSON parser, cookie-parser</text>
<text x="540.0" y="704" text-anchor="middle" font-size="12" fill="#111">Routers: /auth, /applicant, /company, /admin, public /jobs and /companies</text>
<text x="540.0" y="721" text-anchor="middle" font-size="12" fill="#111">Global error handler (multer and other errors, HTTP 400)</text>
<line x1="540" y1="732" x2="540" y2="762" stroke="#111" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="50" y="762" width="980" height="210" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.6"/>
<text x="540" y="782" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Application Server (Node.js runtime)</text>
<rect x="80" y="798" width="215" height="160" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="187.5" y="820" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Security Middleware</text>
<text x="187.5" y="845" text-anchor="middle" font-size="12" fill="#111">authMiddleware: verifies JWT</text>
<text x="187.5" y="862" text-anchor="middle" font-size="12" fill="#111">cookie, loads the user</text>
<text x="187.5" y="879" text-anchor="middle" font-size="12" fill="#111">roleMiddleware: allows only</text>
<text x="187.5" y="896" text-anchor="middle" font-size="12" fill="#111">applicant | company | admin</text>
<text x="187.5" y="913" text-anchor="middle" font-size="12" fill="#111">bcrypt hashing, JWT 1 day</text>
<rect x="315" y="798" width="215" height="160" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="422.5" y="820" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Upload Middleware (multer)</text>
<text x="422.5" y="845" text-anchor="middle" font-size="12" fill="#111">In-memory storage, max 5 MB</text>
<text x="422.5" y="862" text-anchor="middle" font-size="12" fill="#111">Resumes: PDF, DOC, DOCX</text>
<text x="422.5" y="879" text-anchor="middle" font-size="12" fill="#111">Photos / logos: PNG, JPG, WebP</text>
<text x="422.5" y="896" text-anchor="middle" font-size="12" fill="#111">Rejects other types with</text>
<text x="422.5" y="913" text-anchor="middle" font-size="12" fill="#111">HTTP 400</text>
<rect x="550" y="798" width="215" height="160" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="657.5" y="820" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Controllers (business logic)</text>
<text x="657.5" y="845" text-anchor="middle" font-size="12" fill="#111">auth, applicant, company,</text>
<text x="657.5" y="862" text-anchor="middle" font-size="12" fill="#111">admin, public jobs</text>
<text x="657.5" y="879" text-anchor="middle" font-size="12" fill="#111">Validation, OTP create / check,</text>
<text x="657.5" y="896" text-anchor="middle" font-size="12" fill="#111">status rules, slug generation,</text>
<text x="657.5" y="913" text-anchor="middle" font-size="12" fill="#111">cascade deletes</text>
<rect x="785" y="798" width="215" height="160" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="892.5" y="820" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Utility Services</text>
<text x="892.5" y="845" text-anchor="middle" font-size="12" fill="#111">mailService (Nodemailer)</text>
<text x="892.5" y="862" text-anchor="middle" font-size="12" fill="#111">uploadToCloudinary</text>
<text x="892.5" y="879" text-anchor="middle" font-size="12" fill="#111">helpers: OTP, JWT,</text>
<text x="892.5" y="896" text-anchor="middle" font-size="12" fill="#111">slug, formatJob,</text>
<text x="892.5" y="913" text-anchor="middle" font-size="12" fill="#111">statusLabel</text>

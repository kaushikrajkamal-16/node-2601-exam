<text x="1180" y="1234" text-anchor="start" font-size="11" fill="#111">two-way request / response</text>
<line x1="1128" y1="1252" x2="1170" y2="1252" stroke="#111" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1180" y="1256" text-anchor="start" font-size="11" fill="#111">one-way call</text>
<text x="1242" y="1274" text-anchor="middle" font-size="10.5" font-style="italic" fill="#555">Logical view; hosting not confirmed</text>
</g>

<text x="1242.5" y="797" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Cloudinary</text>
<text x="1242.5" y="822" text-anchor="middle" font-size="12" fill="#111">Photos, logos, resumes</text>
<text x="1242.5" y="839" text-anchor="middle" font-size="12" fill="#111">HTTPS, Cloudinary SDK</text>
<text x="1242.5" y="856" text-anchor="middle" font-size="12" fill="#111">upload / delete files</text>
<rect x="1130" y="890" width="225" height="88" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="1242.5" y="912" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Gmail SMTP</text>
<text x="1242.5" y="937" text-anchor="middle" font-size="12" fill="#111">OTP e-mails: registration</text>
<text x="1242.5" y="954" text-anchor="middle" font-size="12" fill="#111">and password reset</text>
<text x="1242.5" y="971" text-anchor="middle" font-size="12" fill="#111">SMTP port 587, STARTTLS</text>

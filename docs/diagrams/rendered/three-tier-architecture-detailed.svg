<rect x="235.0" y="1102" width="230" height="20" fill="#fff" fill-opacity="0.95"/>
<text x="350" y="1117" text-anchor="middle" font-size="12" font-weight="700" fill="#111">Read / write via Mongoose ODM</text>
<rect x="235.0" y="1123" width="230" height="20" fill="#fff" fill-opacity="0.95"/>
<text x="350" y="1138" text-anchor="middle" font-size="12" font-weight="700" fill="#111">(MongoDB connection: MONGO_URI)</text>
<rect x="40" y="1178" width="1000" height="270" fill="#fff2cc" stroke="#d6b656" stroke-width="1.6"/>
<text x="540.0" y="1200" text-anchor="middle" font-size="14" font-weight="700" fill="#111">DATABASE TIER - Data Storage Layer</text>
<path d="M85,1222 v95 a35,12 0 0 0 70,0 v-95" fill="#d9ecff" stroke="#3b6ea5" stroke-width="2"/><ellipse cx="120" cy="1222" rx="35" ry="12" fill="#eaf4ff" stroke="#3b6ea5" stroke-width="2"/>
<text x="120" y="1350" text-anchor="middle" font-size="12" font-weight="700" fill="#111">MongoDB (NoSQL)</text>
<text x="120" y="1366" text-anchor="middle" font-size="12" fill="#111">primary database</text>
<rect x="190" y="1215" width="250" height="112" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="315.0" y="1237" text-anchor="middle" font-size="13" font-weight="700" fill="#111">users</text>
<text x="315.0" y="1262" text-anchor="middle" font-size="12" fill="#111">name, email (unique), password (hash),</text>
<text x="315.0" y="1279" text-anchor="middle" font-size="12" fill="#111">role, isVerified, OTP + expiry,</text>
<text x="315.0" y="1296" text-anchor="middle" font-size="12" fill="#111">phone, photo, department, batch,</text>
<text x="315.0" y="1313" text-anchor="middle" font-size="12" fill="#111">isFlagged, industry, address, ...</text>
<rect x="455" y="1215" width="250" height="112" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="580.0" y="1237" text-anchor="middle" font-size="13" font-weight="700" fill="#111">jobs</text>
<text x="580.0" y="1262" text-anchor="middle" font-size="12" fill="#111">title, slug (unique), department,</text>
<text x="580.0" y="1279" text-anchor="middle" font-size="12" fill="#111">type, mode, location, salary,</text>
<text x="580.0" y="1296" text-anchor="middle" font-size="12" fill="#111">deadline, skills, requirements,</text>
<text x="580.0" y="1313" text-anchor="middle" font-size="12" fill="#111">status: active | paused | closed</text>
<rect x="720" y="1215" width="250" height="112" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="845.0" y="1237" text-anchor="middle" font-size="13" font-weight="700" fill="#111">applications</text>
<text x="845.0" y="1262" text-anchor="middle" font-size="12" fill="#111">job, applicant, company (references)</text>
<text x="845.0" y="1279" text-anchor="middle" font-size="12" fill="#111">resume (Cloudinary URL), resumeName</text>
<text x="845.0" y="1296" text-anchor="middle" font-size="12" fill="#111">status: pending ... rejected (6 values)</text>
<text x="845.0" y="1313" text-anchor="middle" font-size="12" fill="#111">statusHistory[] embedded</text>
<rect x="190" y="1338" width="780" height="92" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="580.0" y="1360" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Constraints and relationships</text>
<text x="580.0" y="1385" text-anchor="middle" font-size="12" fill="#111">Unique: users.email, jobs.slug, applications (job + applicant). Embedded: statusHistory.</text>
<text x="580.0" y="1402" text-anchor="middle" font-size="12" fill="#111">References (job to company, application to job and applicant) are enforced in code,</text>
<text x="580.0" y="1419" text-anchor="middle" font-size="12" fill="#111">not by MongoDB.</text>
<rect x="1110" y="1090" width="265" height="190" fill="#fff" stroke="#999" stroke-width="1"/>
<text x="1242" y="1110" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Legend</text>
<rect x="1125" y="1124" width="26" height="15" fill="#f8cecc" stroke="#b85450"/>
<text x="1162" y="1136" text-anchor="start" font-size="12" fill="#111">Presentation tier (browser)</text>
<rect x="1125" y="1148" width="26" height="15" fill="#b9c6d2" stroke="#6b7f92"/>
<text x="1162" y="1160" text-anchor="start" font-size="12" fill="#111">Application tier (Node.js API)</text>
<rect x="1125" y="1172" width="26" height="15" fill="#fff2cc" stroke="#d6b656"/>
<text x="1162" y="1184" text-anchor="start" font-size="12" fill="#111">Data tier (MongoDB)</text>
<rect x="1125" y="1196" width="26" height="15" fill="#e1fbff" stroke="#36a3b8"/>
<text x="1162" y="1208" text-anchor="start" font-size="12" fill="#111">External services</text>

<line x1="530" y1="878" x2="550" y2="878" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="765" y1="878" x2="785" y2="878" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="80" y="990" width="215" height="72" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="187.5" y="1012" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Global Error Handler</text>
<text x="187.5" y="1037" text-anchor="middle" font-size="12" fill="#111">Returns { success:false,</text>
<text x="187.5" y="1054" text-anchor="middle" font-size="12" fill="#111">message } with a status</text>
<rect x="315" y="990" width="450" height="72" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="540.0" y="1012" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Mongoose ODM Models (run inside the Node process)</text>
<text x="540.0" y="1037" text-anchor="middle" font-size="12" fill="#111">User, Job, Application: schemas, indexes,</text>
<text x="540.0" y="1054" text-anchor="middle" font-size="12" fill="#111">password-hash hook, ComparePassword()</text>
<rect x="790" y="990" width="215" height="72" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="897.5" y="1012" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Configuration (.env)</text>
<text x="897.5" y="1037" text-anchor="middle" font-size="12" fill="#111">PORT, BASE_URL, CLIENT_URL,</text>
<text x="897.5" y="1054" text-anchor="middle" font-size="12" fill="#111">JWT_SEC, MONGO_URI (names)</text>
<line x1="657" y1="958" x2="657" y2="990" stroke="#111" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="690" y="978" text-anchor="start" font-size="11" fill="#111">uses</text>
<rect x="1110" y="740" width="265" height="290" fill="#e1fbff" stroke="#36a3b8" stroke-width="1.6"/>
<text x="1242.5" y="762" text-anchor="middle" font-size="14" font-weight="700" fill="#111">THIRD-PARTY SERVICES</text>

<text x="540.0" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#111">CLIENT TIER - Presentation Layer</text>
<rect x="60" y="312" width="225" height="160" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="172.5" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Web Client (Browser)</text>
<text x="172.5" y="359" text-anchor="middle" font-size="12" fill="#111">React 19 single-page app</text>
<text x="172.5" y="376" text-anchor="middle" font-size="12" fill="#111">built with Vite</text>
<text x="172.5" y="393" text-anchor="middle" font-size="12" fill="#111">Redux Toolkit / RTK Query</text>
<text x="172.5" y="410" text-anchor="middle" font-size="12" fill="#111">(state, cache, API calls)</text>
<text x="172.5" y="427" text-anchor="middle" font-size="12" fill="#111">Tailwind CSS 4 styling</text>
<rect x="305" y="312" width="225" height="160" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="417.5" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Pages and Layouts</text>
<text x="417.5" y="359" text-anchor="middle" font-size="12" fill="#111">Public: Home, Jobs, Job Details,</text>
<text x="417.5" y="376" text-anchor="middle" font-size="12" fill="#111">Companies, About, Contact</text>
<text x="417.5" y="393" text-anchor="middle" font-size="12" fill="#111">Auth: Login, Register, Verify OTP,</text>
<text x="417.5" y="410" text-anchor="middle" font-size="12" fill="#111">Forgot / Reset Password</text>
<text x="417.5" y="427" text-anchor="middle" font-size="12" fill="#111">Dashboards: Applicant, Recruiter, Admin</text>
<rect x="550" y="312" width="225" height="160" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="662.5" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Routing and Access Guard</text>
<text x="662.5" y="359" text-anchor="middle" font-size="12" fill="#111">React Router</text>
<text x="662.5" y="376" text-anchor="middle" font-size="12" fill="#111">ProtectedRoute: calls GET /auth/getme,</text>
<text x="662.5" y="393" text-anchor="middle" font-size="12" fill="#111">redirects to /login or to the</text>
<text x="662.5" y="410" text-anchor="middle" font-size="12" fill="#111">user's own dashboard by role</text>
<text x="662.5" y="427" text-anchor="middle" font-size="12" fill="#111">(UX only; server enforces roles)</text>
<rect x="795" y="312" width="225" height="160" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="907.5" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#111">API Modules and Forms</text>
<text x="907.5" y="359" text-anchor="middle" font-size="12" fill="#111">authApi, publicApi, applicantApi,</text>
<text x="907.5" y="376" text-anchor="middle" font-size="12" fill="#111">companyApi, adminApi</text>
<text x="907.5" y="393" text-anchor="middle" font-size="12" fill="#111">Modals: Apply (resume upload),</text>
<text x="907.5" y="410" text-anchor="middle" font-size="12" fill="#111">Post Job, Edit Profile,</text>
<text x="907.5" y="427" text-anchor="middle" font-size="12" fill="#111">Add Applicant / Add Company</text>
<line x1="540" y1="485" x2="540" y2="580" stroke="#111" stroke-width="1.8" marker-end="url(#ah)" marker-start="url(#ahs)"/>

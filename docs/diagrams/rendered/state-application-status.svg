<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="360px" preserveAspectRatio="none" style="width:2173px;height:360px;background:#FFFFFF;" version="1.1" viewBox="0 0 2173 360" width="2173px" zoomAndPan="magnify"><title>State Machine - Application.status lifecycle</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="298.9424" x="933.0288" y="23.5625">State Machine - Application.status lifecycle</text><!--cluster NotApproved--><g id="cluster_NotApproved"><path d="M1305,126.4395 L1688,126.4395 A12.5,12.5 0 0 1 1700.5,138.9395 L1700.5,148.3789 L1292.5,148.3789 L1292.5,138.9395 A12.5,12.5 0 0 1 1305,126.4395 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="226.5" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="408" x="1292.5" y="126.4395"/><line style="stroke:#181818;stroke-width:0.5;" x1="1292.5" x2="1700.5" y1="148.3789" y2="148.3789"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.1094" x="1433.4453" y="140.002">Status != approved</text></g><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73.2734" x="556" y="153.4395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.2734" x="561" y="178.5322">approved</text><ellipse cx="1308.5" cy="52.4395" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN13"><path d="M1711,121.4395 L1711,225.8164 L2166.4336,225.8164 L2166.4336,131.4395 L2156.4336,121.4395 L1711,121.4395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2156.4336,121.4395 L2156.4336,131.4395 L2166.4336,131.4395 L2156.4336,121.4395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.9604" x="1717" y="139.0332">UpdateApplicationStatus (PATCH /company/candidates/status/:id)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.4697" x="1717" y="154.7627">accepts any of the six values from any current value.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="434.4336" x="1717" y="170.4922">The code enforces NO ordering (e.g. pending -&gt; approved is allowed).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.6689" x="1717" y="186.2217">Each real change appends {status, changedAt} to statusHistory;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.4214" x="1717" y="201.9512">setting the same status again changes nothing.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.1094" x="1717" y="217.6807">Moves among the five non-approved values stay inside this box.</text></g><ellipse cx="891.5" cy="323.9395" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="891.5" cy="323.9395" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN25"><path d="M6,296.4395 L6,353.6279 A0,0 0 0 0 6,353.6279 L379.0601,353.6279 A0,0 0 0 0 379.0601,353.6279 L379.0601,306.4395 L369.0601,296.4395 L197.2723,296.4395 L555.8974,176.3273 L189.2723,296.4395 L6,296.4395 A0,0 0 0 0 6,296.4395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M369.0601,296.4395 L369.0601,306.4395 L379.0601,306.4395 L369.0601,296.4395 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.0601" x="12" y="314.0332">Explicitly enforced prohibition: applicant withdrawal of an</text><text fill="#000000" font-family="sans-serif" 
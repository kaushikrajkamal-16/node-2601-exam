<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#333"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#888"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#b3261e"/></marker></defs>
<rect width="1500" height="900" fill="#fff"/>
<text x="750.0" y="40" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#111" font-weight="bold" text-anchor="middle">State Machine - Application status (Application.status)</text>
<text x="750.0" y="64" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#666" font-weight="normal" text-anchor="middle">Derived from applicantController (ApplyJob, WithdrawApplication) and companyController (UpdateApplicationStatus, DeleteCandidate)</text>
<rect x="130" y="95" width="1240" height="470" rx="18" fill="#f7f9fc" stroke="#4a6fa5" stroke-width="2" stroke-dasharray="9 6"/>
<text x="150" y="122" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#2c4a7a" font-weight="bold" text-anchor="start">STATUS SET BY THE COMPANY  -  PATCH /company/candidates/status/:id</text>
<text x="150" y="142" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#2c4a7a" font-weight="normal" text-anchor="start" font-style="italic">Any of the six values can be set from any current value: the code checks only that the value is in the allowed list (no ordering).</text>
<circle cx="70" cy="262" r="12" fill="#222"/>
<polyline points="82,262 190,262" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="135" y="250" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">ApplyJob</text>
<rect x="190" y="222" width="190" height="76" rx="22" fill="#fff6d6" stroke="#c9a227" stroke-width="2.5"/>
<text x="285.0" y="256" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#222" font-weight="bold" text-anchor="middle">pending</text>
<text x="285.0" y="278" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="middle">default on apply</text>
<rect x="470" y="222" width="190" height="76" rx="22" fill="#e3f1fb" stroke="#3b82c4" stroke-width="2.5"/>
<text x="565.0" y="256" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#222" font-weight="bold" text-anchor="middle">shortlisted</text>
<text x="565.0" y="278" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="middle"></text>
<rect x="750" y="222" width="190" height="76" rx="22" fill="#ece4f7" stroke="#7a4fb5" stroke-width="2.5"/>
<text x="845.0" y="256" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#222" font-weight="bold" text-anchor="middle">exam</text>
<text x="845.0" y="278" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="middle"></text>
<rect x="1030" y="222" width="190" height="76" rx="22" fill="#ffe9d6" stroke="#d9822b" stroke-width="2.5"/>
<text x="1125.0" y="256" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#222" font-weight="bold" text-anchor="middle">interview</text>
<text x="1125.0" y="278" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="middle">+ interviewNote</text>
<polyline points="380,260 470,260" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="660,260 750,260" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="940,260 1030,260" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="425" y="250" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#777" font-weight="normal" text-anchor="middle" font-style="italic">typical</text>
<rect x="470" y="430" width="230" height="76" rx="22" fill="#dff3e3" stroke="#2e8b4f" stroke-width="2.5"/>
<text x="585.0" y="464" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#222" font-weight="bold" text-anchor="middle">approved</text>
<text x="585.0" y="486" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="middle">hired - cannot be withdrawn</text>
<rect x="900" y="430" width="190" height="76" rx="22" fill="#fbe0df" stroke="#c0392b" stroke-width="2.5"/>
<text x="995.0" y="464" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#222" font-weight="bold" text-anchor="middle">rejected</text>
<text x="995.0" y="486" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="middle"></text>
<polyline points="1125,298 1125,360 1000,360 1000,430" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<polyline points="1080,298 1080,345 585,345 585,430" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="840" y="338" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333" font-weight="normal" text-anchor="middle" font-style="italic">company sets approved / rejected</text>
<polyline points="285,298 285,470 470,470" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/>
<polyline points="250,298 250,520 995,520 995,506" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/>
<text x="370" y="538" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666" font-weight="normal" text-anchor="middle" font-style="italic">any status can jump directly to approved or rejected (dashed)</text>
<text x="850" y="415" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#222" font-weight="normal" text-anchor="middle"></text>
<text x="1125" y="550" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#666" font-weight="normal" text-anchor="middle" font-style="italic">approved and rejected can be changed again by the company</text>
<circle cx="750" cy="745" r="17" fill="#fff" stroke="#222" stroke-width="2.5"/><circle cx="750" cy="745" r="9" fill="#222"/>
<polyline points="200,565 200,745 731,745" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="200" y="640" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222" font-weight="bold" text-anchor="start">WithdrawApplication</text>
<text x="212" y="660" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="start">applicant, own application</text>
<text x="212" y="678" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="start">guard: status != approved</text>
<text x="212" y="696" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="start">/ delete resume file + application</text>
<line x1="750" y1="565" x2="750" y2="727" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="765" y="620" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222" font-weight="bold" text-anchor="start">DeleteCandidate</text>
<text x="765" y="640" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="start">company, own application, any status</text>
<text x="765" y="658" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="start">/ delete resume file + application</text>
<polyline points="1300,565 1300,745 769,745" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#a)"/>
<text x="1285" y="640" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222" font-weight="bold" text-anchor="end">Cascade delete</text>
<text x="1285" y="660" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="end">job deleted (company or admin),</text>
<text x="1285" y="678" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="end">company or applicant account deleted</text>
<text x="1285" y="696" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#555" font-weight="normal" text-anchor="end">/ applications + resume files removed</text>
<rect x="1010" y="570" width="270" height="0" fill="none"/>
<rect x="40" y="790" width="1420" height="86" rx="10" fill="#fffbe3" stroke="#d6c76a"/>
<text x="60" y="815" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#333" font-weight="bold" text-anchor="start">Notes</text>
<text x="60" y="837" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#333" font-weight="normal" text-anchor="start">A new application starts as pending with statusHistory=[pending]. Each real change appends {status, changedAt}; sending the same status again changes nothing. The applicant sees the timeline in My applications.</text>
<text x="60" y="857" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#b3261e" font-weight="normal" text-anchor="start">Blocked by code: WithdrawApplication on an approved application returns 400 "You can't withdraw an approved application."   Status updates only work on the company's own applications (404 otherwise).</text>
</svg>